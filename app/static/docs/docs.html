<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok2API - 接口文档</title>
  <link rel="icon" href="/static/favicon/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono/index.css" rel="stylesheet">
  <link href="/static/common/common.css?v=apple" rel="stylesheet">
  <link href="/static/docs/docs.css?v=apple" rel="stylesheet">
  <link href="/static/common/toast.css?v=apple" rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col" style="background-color: var(--bg);">

  <div id="app-header"></div>

  <main class="space-y-6 flex-1 container mx-auto max-w-7xl px-6 py-8 fade-in">
    <div class="flex flex-wrap justify-between items-start gap-3">
      <div>
        <h2 class="text-2xl font-semibold tracking-tight">接口文档</h2>
        <p class="text-[var(--accents-4)] mt-1 text-sm">
          查看 Grok2API 开放的 OpenAI 兼容接口，学习如何快速接入常用客户端或生成代码调用。
        </p>
      </div>
    </div>

    <!-- 顶部选项卡 -->
    <div class="border-b border-[var(--border)] mt-4">
      <nav class="-mb-px flex space-x-6" aria-label="Tabs">
        <button onclick="switchTab('guide')" id="tab-btn-guide" class="tab-btn active border-b-2 px-1 pb-4 text-sm font-medium">
          接入指南
        </button>
        <button onclick="switchTab('examples')" id="tab-btn-examples" class="tab-btn border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-[var(--accents-4)] hover:text-black">
          代码示例
        </button>
        <button onclick="switchTab('playground')" id="tab-btn-playground" class="tab-btn border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-[var(--accents-4)] hover:text-black">
          在线调试 (Swagger UI)
        </button>
      </nav>
    </div>

    <!-- Tab 1: 接入指南 -->
    <div id="tab-content-guide" class="tab-content space-y-6">
      <!-- 基础接入参数 -->
      <div class="rounded-xl border border-[var(--border)] bg-white p-6 shadow-xs">
        <h3 class="text-lg font-semibold mb-4">基本连接信息</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-3">
            <div>
              <span class="text-xs text-[var(--accents-4)] block mb-1">接口代理地址 (API Base URL)</span>
              <div class="flex items-center gap-2 bg-[var(--bg)] p-2 rounded-md border border-[var(--border)] font-mono text-sm">
                <span id="base-url-text" class="flex-1 overflow-x-auto truncate">加载中...</span>
                <button onclick="copyText('base-url-text')" class="copy-btn hover:text-black text-[var(--accents-4)]" title="复制">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="space-y-3">
            <div>
              <span class="text-xs text-[var(--accents-4)] block mb-1">认证方式 (Authentication)</span>
              <div class="flex items-center gap-2 bg-[var(--bg)] p-2 rounded-md border border-[var(--border)] font-mono text-sm">
                <span class="flex-1 text-[var(--accents-6)]">Bearer &lt;API_KEY&gt;</span>
                <a href="/admin/keys" class="text-xs text-blue-600 hover:underline font-sans">去创建 Key</a>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Tab 2: 代码示例 -->
    <div id="tab-content-examples" class="tab-content space-y-6 hidden">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- 左侧接口列表 -->
        <div class="lg:col-span-1 space-y-2">
          <span class="text-xs font-semibold text-[var(--accents-4)] uppercase tracking-wider block px-2 mb-2">选择接口</span>
          <button onclick="switchExampleApi('chat')" id="api-btn-chat" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between bg-black text-white">
            <span>对话服务</span>
            <span class="text-[10px] font-mono bg-emerald-600 text-white px-1 py-0.2 rounded font-bold">POST</span>
          </button>
          <button onclick="switchExampleApi('images')" id="api-btn-images" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between text-[var(--accents-6)] hover:bg-gray-100">
            <span>图像生成</span>
            <span class="text-[10px] font-mono bg-emerald-600 text-white px-1 py-0.2 rounded font-bold">POST</span>
          </button>
          <button onclick="switchExampleApi('videos')" id="api-btn-videos" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between text-[var(--accents-6)] hover:bg-gray-100">
            <span>视频生成</span>
            <span class="text-[10px] font-mono bg-emerald-600 text-white px-1 py-0.2 rounded font-bold">POST</span>
          </button>
          <button onclick="switchExampleApi('models')" id="api-btn-models" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between text-[var(--accents-6)] hover:bg-gray-100">
            <span>获取模型列表</span>
            <span class="text-[10px] font-mono bg-blue-600 text-white px-1 py-0.2 rounded font-bold">GET</span>
          </button>
          <button onclick="switchExampleApi('responses')" id="api-btn-responses" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between text-[var(--accents-6)] hover:bg-gray-100">
            <span>Responses API</span>
            <span class="text-[10px] font-mono bg-emerald-600 text-white px-1 py-0.2 rounded font-bold">POST</span>
          </button>
        </div>

        <!-- 右侧代码区域 -->
        <div class="lg:col-span-3 bg-white border border-[var(--border)] rounded-xl overflow-hidden flex flex-col">
          <!-- 内部语言导航 -->
          <div class="bg-gray-50 border-b border-[var(--border)] px-4 py-2.5 flex items-center justify-between">
            <div class="flex space-x-4">
              <button onclick="switchLang('curl')" id="lang-btn-curl" class="lang-btn active text-xs font-semibold text-black">cURL</button>
              <button onclick="switchLang('python')" id="lang-btn-python" class="lang-btn text-xs font-semibold text-[var(--accents-4)] hover:text-black">Python</button>
              <button onclick="switchLang('node')" id="lang-btn-node" class="lang-btn text-xs font-semibold text-[var(--accents-4)] hover:text-black">Node.js</button>
            </div>
            <button onclick="copyCurrentCode()" class="text-xs text-[var(--accents-5)] hover:text-black flex items-center gap-1 font-medium">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
              </svg>
              <span>复制</span>
            </button>
          </div>
          <!-- 代码展示块 -->
          <pre class="p-6 text-sm font-mono overflow-auto flex-1 bg-[#1d1d22] text-[#cfd2d9] whitespace-pre" id="code-block-content"><code></code></pre>
        </div>

      </div>
    </div>

    <!-- Tab 3: 在线调试 (Swagger UI) -->
    <div id="tab-content-playground" class="tab-content hidden">
      <!-- 动态加载 Loading 状态 -->
      <div id="swagger-loader" class="text-center py-16 space-y-3">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-black"></div>
        <p class="text-sm text-[var(--accents-4)]">正在构建 API 规范并在本地解析 Swagger UI...</p>
      </div>
      <!-- Swagger UI 挂载点 -->
      <div id="swagger-ui-container" class="bg-white border border-[var(--border)] rounded-xl overflow-hidden shadow-xs hidden">
        <div id="swagger-ui"></div>
      </div>
    </div>

  </main>

  <div id="app-footer"></div>

  <!-- 脚本加载 -->
  <script src="/static/common/admin-auth.js?v=apple"></script>
  <script src="/static/common/header.js?v=apple"></script>
  <script src="/static/common/footer.js?v=apple"></script>
  <script src="/static/common/toast.js?v=apple"></script>
  <script src="/static/common/utils.js?v=apple"></script>
  <script src="/static/docs/docs.js?v=apple"></script>
</body>

</html>
