<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok2API - 登录</title>
  <link rel="icon" href="/static/favicon/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono/index.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Geist Sans', 'sans-serif'] },
          colors: {
            dark: '#000000',
            light: '#ffffff',
            subtle: '#666666',
            border: '#e5e5e5'
          }
        }
      }
    }
  </script>
  <link href="/static/common/common.css?v=apple" rel="stylesheet">
  <link href="/static/login/login.css?v=apple" rel="stylesheet">
  <link href="/static/common/toast.css?v=apple" rel="stylesheet">
</head>

<body class="login-body">
  <div class="login-bg" aria-hidden="true"></div>

  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-link">
          <span>Grok2API</span>
        </div>
      </div>
      <div class="login-title">管理后台</div>
      <div class="login-subtitle">请输入账户名和密码以继续</div>

      <div class="login-form">
        <input type="text" id="username-input" placeholder="账户名" autocomplete="username"
          class="geist-input login-input">
        <input type="password" id="password-input" placeholder="密码" autocomplete="current-password"
          class="geist-input login-input">
        <button onclick="login()" class="geist-button login-button">登录</button>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/static/common/admin-auth.js?v=apple"></script>
  <script src="/static/common/toast.js?v=apple"></script>
  <script src="/static/common/footer.js?v=apple"></script>
  <script src="/static/login/login.js?v=apple"></script>
</body>

</html>
