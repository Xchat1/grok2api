<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok2API - 数据中心</title>
  <link rel="icon" href="/static/favicon/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono/index.css" rel="stylesheet">
  <link href="/static/common/common.css?v=apple" rel="stylesheet">
  <link href="/static/common/toast.css?v=apple" rel="stylesheet">
  <link href="/static/datacenter/datacenter.css?v=apple" rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col" style="background-color: var(--bg);">
  <div id="app-header"></div>

  <main class="space-y-6 flex-1 container mx-auto max-w-7xl px-6 py-8 fade-in">
    <div class="space-y-6">
      <div class="flex flex-wrap justify-between items-start gap-3">
        <div>
          <h2 class="text-2xl font-semibold tracking-tight">数据中心</h2>
          <p class="text-[var(--accents-4)] mt-1 text-sm">常用指标与趋势分析。</p>
        </div>
        <div class="datacenter-controls flex items-center gap-2">
          <button id="btn-refresh" class="geist-button-outline text-xs px-3">刷新</button>
          <button id="btn-clear-metrics" class="geist-button-outline text-xs px-3 text-amber-600 hover:text-amber-700" title="清空请求统计与趋势记录">清空指标</button>
          <label class="dc-toggle text-xs text-[var(--accents-4)]">
            <input id="auto-refresh" type="checkbox" class="checkbox" checked>
            自动刷新
          </label>
        </div>
      </div>

      <div class="h-px bg-[var(--border)] my-6"></div>

      <!-- Summary Cards -->
      <div class="dc-section">
        <div class="dc-section-title">Token 状态</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="stat-card">
            <div class="stat-value" id="m-token-total">-</div>
            <div class="stat-label">Token 总数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value text-green-600" id="m-token-active">-</div>
            <div class="stat-label">Token 正常</div>
          </div>
          <div class="stat-card">
            <div class="stat-value text-orange-500" id="m-token-cooling">-</div>
            <div class="stat-label">Token 限流</div>
          </div>
          <div class="stat-card">
            <div class="stat-value text-red-600" id="m-token-invalid">-</div>
            <div class="stat-label">Token 失效</div>
          </div>
        </div>
      </div>

      <div class="dc-section">
        <div class="dc-section-title">请求统计</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="stat-card">
            <div class="stat-value" id="m-total-calls">-</div>
            <div class="stat-label">总调用次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="m-req-total">-</div>
            <div class="stat-label">总请求数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value text-green-600" id="m-req-success">-</div>
            <div class="stat-label">成功请求</div>
          </div>
          <div class="stat-card">
            <div class="stat-value text-red-600" id="m-req-failed">-</div>
            <div class="stat-label">失败请求</div>
          </div>
        </div>
      </div>

      <div class="dc-section">
        <div class="dc-section-title">资源与缓存</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="stat-card">
            <div class="stat-value" id="m-success-rate">-</div>
            <div class="stat-label">成功率</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="m-local-image">-</div>
            <div class="stat-label">本地图片</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="m-local-video">-</div>
            <div class="stat-label">本地视频</div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="dc-section">
        <div class="dc-section-title">趋势分析</div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="card">
            <div class="card-title">24 小时请求趋势</div>
            <div class="chart-wrap">
              <canvas id="chart-hourly"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-title">7 天请求统计</div>
            <div class="chart-wrap">
              <canvas id="chart-daily"></canvas>
            </div>
          </div>
          <div class="card lg:col-span-2">
            <div class="card-title">模型调用分布（Top 10）</div>
            <div class="chart-wrap chart-wrap-wide">
              <canvas id="chart-models"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/static/common/admin-auth.js?v=apple"></script>
  <script src="/static/common/header.js?v=apple"></script>
  <script src="/static/common/footer.js?v=apple"></script>
  <script src="/static/common/toast.js?v=apple"></script>
  <script src="/static/datacenter/datacenter.js?v=apple"></script>
</body>

</html>
